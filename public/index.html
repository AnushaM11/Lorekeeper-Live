<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorekeeper Live Overlay</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .animate-slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }
        .animate-fade-out {
            animation: fadeOut 0.5s ease-in forwards;
        }
    </style>
</head>
<body class="bg-transparent overflow-hidden p-6">

    <!-- Lore Alert Card Container -->
    <div id="alert-container" class="w-[450px]"></div>

    <script>
        const container = document.getElementById('alert-container');
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'LORE_ALERT') {
                showLoreCard(data.user, data.question, data.answer);
            }
        };

        function showLoreCard(user, question, answer) {
            // Clear existing cards
            container.innerHTML = '';

            const card = document.createElement('div');
            card.className = `bg-slate-900/90 backdrop-blur-md border border-purple-500/30 text-white rounded-xl p-4 shadow-2xl shadow-purple-900/40 animate-slide-in`;
            
            card.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-purple-400 bg-purple-950/60 px-2 py-0.5 rounded-full border border-purple-800/50">✨ Lore Drop</span>
                    <span class="text-xs text-slate-400">Asked by @${user}</span>
                </div>
                <p class="text-sm font-medium text-slate-200 mb-1">"${question}"</p>
                <p class="text-xs text-slate-300 bg-slate-800/80 p-2.5 rounded-lg border border-slate-700/50 leading-relaxed">${answer}</p>
            `;

            container.appendChild(card);

            // Auto dismiss after 8 seconds
            setTimeout(() => {
                card.classList.remove('animate-slide-in');
                card.classList.add('animate-fade-out');
                setTimeout(() => card.remove(), 500);
            }, 8000);
        }
    </script>
</body>
</html>
